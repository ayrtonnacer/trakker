<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo foco</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --text: #37352f; --muted: #787774; --ok: #448361; }
  @media (prefers-color-scheme: dark) { :root { --bg: #191919; --text: #e3e2e0; --muted: #9b9a97; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
  .tree { font-size: 64px; }
  h1 { margin: 12px 0 6px; font-size: 26px; }
  p { margin: 0; color: var(--muted); }
  b { color: var(--ok); }
</style>
</head>
<body>
  <main>
    <div class="tree" aria-hidden="true">🌳</div>
    <h1>Estás en modo foco</h1>
    <p><b id="site">Este sitio</b> está bloqueado mientras corre tu timer en Tasker CRM.</p>
    <p>Pará el timer para desbloquearlo.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
